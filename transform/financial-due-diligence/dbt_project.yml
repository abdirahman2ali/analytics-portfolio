name: financial_due_diligence
version: "1.0.0"
config-version: 2

profile: financial_due_diligence

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  financial_due_diligence:
    bronze:
      +materialized: view
      +schema: "financial_due_diligence_bronze"

    silver:
      +materialized: incremental
      +file_format: delta
      +incremental_strategy: merge
      +schema: "financial_due_diligence_silver"

    gold:
      +materialized: incremental
      +file_format: delta
      +incremental_strategy: merge
      +schema: "financial_due_diligence_gold"

seeds:
  financial_due_diligence:
    +schema: "financial_due_diligence_bronze"
