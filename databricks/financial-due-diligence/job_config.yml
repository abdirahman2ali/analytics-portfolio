name: financial_due_diligence_pipeline

schedule:
  quartz_cron_expression: "0 0 7 ? * MON-FRI"
  timezone_id: UTC
  pause_status: UNPAUSED

tasks:
  - task_key: edgar_ingestion
    description: "Fetch S&P 500 XBRL facts from SEC EDGAR and write to Databricks Delta."
    python_script_task:
      python_file: ingestion/financial-due-diligence/edgar_ingestion.py
    new_cluster:
      spark_version: "15.4.x-scala2.12"
      node_type_id: i3.xlarge
      num_workers: 0
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*]
      data_security_mode: SINGLE_USER
    libraries:
      - pypi:
          package: requests==2.32.3
      - pypi:
          package: pandas==2.2.2
      - pypi:
          package: databricks-sql-connector==3.4.0
      - pypi:
          package: python-dotenv==1.0.1
      - pypi:
          package: lxml==5.2.2

  - task_key: dbt_run
    description: "Build all bronze, silver, and gold dbt models."
    depends_on:
      - task_key: edgar_ingestion
    dbt_task:
      project_directory: transform/financial-due-diligence
      commands:
        - "dbt deps"
        - "dbt build --select bronze+ --fail-fast"
    new_cluster:
      spark_version: "15.4.x-scala2.12"
      node_type_id: i3.xlarge
      num_workers: 0
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*]
      data_security_mode: SINGLE_USER

email_notifications:
  on_failure:
    - PLACEHOLDER_EMAIL
  no_alert_for_skipped_runs: true

max_concurrent_runs: 1
format: MULTI_TASK
